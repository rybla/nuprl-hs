name: nuprl-hs
version: 0.1.0.0
github: "rybla/nuprl-hs"
license: BSD-3-Clause
author: "Henry Blanchette"
maintainer: "contact@rybl.net"
copyright: "2026 Henry Blanchette"
synopsis: A modern Haskell implementation of the NuPRL proof development system
category: Theorem Provers
description: |
  nuprl-hs is a modern, purely-functional implementation of the NuPRL
  computational type theory (CTT) proof development system. It provides a
  refinement theorem prover, a tactic language, a theory library, and a
  complete command-line interface.

extra-source-files:
  - README.md
  - CHANGELOG.md
  - docs/*.md
  - examples/**/*.nuprl

data-files:
  - examples/**/*.nuprl

dependencies:
  - base >= 4.17 && < 5
  - text >= 2.0
  - containers >= 0.6
  - mtl >= 2.3
  - transformers >= 0.6
  - megaparsec >= 9.6
  - parser-combinators >= 1.3
  - prettyprinter >= 1.7
  - prettyprinter-ansi-terminal >= 1.1
  - filepath >= 1.4
  - directory >= 1.3
  - haskeline >= 0.8
  - optparse-applicative >= 0.18
  - ansi-terminal >= 1.1

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

default-extensions:
  - DerivingStrategies
  - DeriveGeneric
  - DeriveFunctor
  - DeriveFoldable
  - DeriveTraversable
  - FlexibleContexts
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - NamedFieldPuns
  - OverloadedStrings
  - PatternSynonyms
  - ScopedTypeVariables
  - StrictData
  - TupleSections
  - TypeApplications
  - ViewPatterns

library:
  source-dirs: src
  exposed-modules:
    - Nuprl
    - Nuprl.Error
    - Nuprl.Term
    - Nuprl.Subst
    - Nuprl.Pretty
    - Nuprl.Parse
    - Nuprl.Compute
    - Nuprl.Sequent
    - Nuprl.Rule
    - Nuprl.Proof
    - Nuprl.Tactic
    - Nuprl.Library
    - Nuprl.Check
    - Nuprl.Command
    - Nuprl.REPL
    - Nuprl.CLI

executables:
  nuprl:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - nuprl-hs

  build-website:
    main: Main.hs
    source-dirs: build-website
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - nuprl-hs
      - text
      - containers
      - mtl
      - filepath
      - directory
      - optparse-applicative

tests:
  nuprl-hs-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - nuprl-hs
      - tasty >= 1.5
      - tasty-hunit >= 0.10
      - tasty-quickcheck >= 0.10
      - QuickCheck >= 2.14
